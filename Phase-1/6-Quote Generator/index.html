<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Quote Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 text-white flex items-center justify-center p-4">
  <main class="w-full max-w-2xl">
    <section class="rounded-3xl border border-white/10 bg-white/10 p-6 sm:p-10 shadow-2xl backdrop-blur-xl">
      <p class="text-xs uppercase tracking-[0.25em] text-indigo-300 mb-6">Random quote</p>

      <blockquote class="min-h-[140px] flex items-center" aria-live="polite">
        <p id="quote" class="text-xl sm:text-2xl lg:text-3xl leading-relaxed font-medium text-balance">
          The only way to do great work is to love what you do.
        </p>
      </blockquote>

      <p id="author" class="mt-5 text-sm sm:text-base text-indigo-200">Steve Jobs</p>

      <p id="status" class="mt-2 min-h-5 text-sm text-rose-300" role="status"></p>

      <div class="mt-8 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
        <button
          id="btn"
          type="button"
          class="inline-flex items-center justify-center rounded-full bg-white px-6 py-3 font-semibold text-slate-900 transition hover:bg-indigo-100 disabled:cursor-not-allowed disabled:opacity-60"
        >
          New quote
        </button>
        <p class="text-xs text-white/50">Quotes provided by DummyJSON.</p>
      </div>
    </section>
  </main>

  <script src="index.js"></script>
</body>
</html>
