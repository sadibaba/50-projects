<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currency Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 text-white flex items-center justify-center p-4">
  <main class="w-full max-w-lg">
    <section class="rounded-3xl border border-white/10 bg-white/10 p-6 shadow-2xl backdrop-blur-xl sm:p-8">
      <header>
        <p class="text-xs uppercase tracking-[0.25em] text-indigo-300">Exchange rates</p>
        <h1 class="mt-2 text-2xl font-semibold sm:text-3xl">Currency Converter</h1>
        <p class="mt-1 text-sm text-white/60">Rates from the free open.er-api.com service.</p>
      </header>

      <div class="mt-6 space-y-4">
        <div>
          <label for="amount" class="block text-sm text-white/70 mb-2">Amount</label>
          <input
            id="amount"
            type="number"
            min="0"
            step="0.01"
            value="1"
            inputmode="decimal"
            class="w-full rounded-xl border border-white/10 bg-slate-900/60 px-4 py-3 text-lg outline-none focus:border-indigo-400"
          />
        </div>

        <div class="grid grid-cols-1 items-end gap-3 sm:grid-cols-[1fr_auto_1fr]">
          <div>
            <label for="from" class="block text-sm text-white/70 mb-2">From</label>
            <select id="from" class="w-full rounded-xl border border-white/10 bg-slate-900 px-4 py-3 outline-none focus:border-indigo-400"></select>
          </div>

          <button
            id="swap"
            type="button"
            class="mx-auto flex h-10 w-10 items-center justify-center rounded-full border border-white/10 bg-white/5 hover:bg-white/10"
            aria-label="Swap currencies"
          >
            <i class="ri-arrow-left-right-line" aria-hidden="true"></i>
          </button>

          <div>
            <label for="to" class="block text-sm text-white/70 mb-2">To</label>
            <select id="to" class="w-full rounded-xl border border-white/10 bg-slate-900 px-4 py-3 outline-none focus:border-indigo-400"></select>
          </div>
        </div>

        <div class="rounded-2xl border border-indigo-400/20 bg-indigo-500/10 p-5">
          <p id="result" class="text-2xl font-semibold sm:text-3xl" aria-live="polite">--</p>
          <p id="rate" class="mt-1 text-sm text-indigo-200/70">Fetching the latest rate...</p>
        </div>

        <p id="status" class="min-h-5 text-sm text-rose-300" role="status" aria-live="polite"></p>

        <button
          id="convert"
          type="button"
          class="w-full rounded-xl bg-indigo-500 px-4 py-3 font-semibold hover:bg-indigo-400 disabled:cursor-not-allowed disabled:opacity-50"
        >
          Convert
        </button>
      </div>
    </section>
  </main>

  <script src="index.js"></script>
</body>
</html>
