<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Color Picker Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 antialiased">
  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-10">
    <header class="mb-8">
      <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight">Color Picker</h1>
      <p class="text-sm sm:text-base text-gray-600 mt-1">
        Pick a color, preview it, check its contrast and copy the HEX, RGB or HSL value.
      </p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
      <section class="bg-white border border-gray-200 rounded-2xl shadow-sm p-5 sm:p-6 space-y-5">
        <div>
          <label for="colorInput" class="block text-sm font-medium text-gray-700 mb-2">
            Pick a color
          </label>
          <div class="flex items-center gap-4">
            <input
              id="colorInput"
              type="color"
              value="#4f46e5"
              class="h-14 w-24 p-0 border border-gray-300 rounded-lg shadow-sm cursor-pointer"
            />
            <p class="text-sm text-gray-500">
              Use the picker or type a HEX value on the right.
            </p>
          </div>
        </div>

        <div>
          <label for="hexInput" class="block text-sm font-medium text-gray-700 mb-2">
            HEX
          </label>
          <div class="flex gap-2">
            <input
              id="hexInput"
              type="text"
              value="#4f46e5"
              placeholder="#000000"
              spellcheck="false"
              autocomplete="off"
              class="flex-1 min-w-0 px-3 py-2 border border-gray-300 rounded-lg font-mono text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
            <button
              id="copyHex"
              type="button"
              class="px-3 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 active:scale-[0.99]"
            >
              Copy
            </button>
          </div>
        </div>

        <div>
          <label for="rgbOutput" class="block text-sm font-medium text-gray-700 mb-2">
            RGB
          </label>
          <div class="flex gap-2">
            <input
              id="rgbOutput"
              type="text"
              readonly
              class="flex-1 min-w-0 px-3 py-2 border border-gray-200 rounded-lg bg-gray-100 font-mono text-sm"
            />
            <button
              id="copyRgb"
              type="button"
              class="px-3 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 active:scale-[0.99]"
            >
              Copy
            </button>
          </div>
        </div>

        <div>
          <label for="hslOutput" class="block text-sm font-medium text-gray-700 mb-2">
            HSL
          </label>
          <div class="flex gap-2">
            <input
              id="hslOutput"
              type="text"
              readonly
              class="flex-1 min-w-0 px-3 py-2 border border-gray-200 rounded-lg bg-gray-100 font-mono text-sm"
            />
            <button
              id="copyHsl"
              type="button"
              class="px-3 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 active:scale-[0.99]"
            >
              Copy
            </button>
          </div>
        </div>
      </section>

      <section class="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden">
        <div class="p-5 sm:p-6">
          <div
            id="preview"
            class="h-48 sm:h-56 rounded-xl border-2 border-white shadow-inner"
            style="background-color: #4f46e5;"
            aria-label="Color preview"
          ></div>
          <p id="contrastNote" class="mt-4 text-sm text-gray-600" aria-live="polite"></p>
        </div>
        <div class="border-t border-gray-100 bg-gray-50 px-5 py-4 text-sm text-gray-500">
          Built with HTML, CSS and JavaScript. HEX edits and the native picker stay in sync.
        </div>
      </section>
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
