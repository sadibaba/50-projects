<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown Timer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-sky-700 to-indigo-950 text-white">
  <main class="flex min-h-screen items-center justify-center px-4 py-10">
    <section class="w-full max-w-3xl text-center">
      <p class="text-xs uppercase tracking-[0.3em] text-sky-200/70">Countdown</p>
      <h1 class="mt-3 text-3xl font-semibold tracking-tight sm:text-4xl">Time until your moment</h1>
      <p class="mx-auto mt-2 max-w-xl text-sm text-sky-100/70 sm:text-base">
        Choose a target date and time. The countdown is saved in this browser.
      </p>

      <div class="mt-8 grid grid-cols-2 gap-3 sm:grid-cols-4 sm:gap-4" aria-live="polite">
        <div class="rounded-2xl border border-white/15 bg-white/10 py-5 backdrop-blur">
          <div id="days" class="text-4xl font-semibold tabular-nums sm:text-5xl">00</div>
          <p class="mt-2 text-xs uppercase tracking-widest text-sky-100/70">Days</p>
        </div>
        <div class="rounded-2xl border border-white/15 bg-white/10 py-5 backdrop-blur">
          <div id="hours" class="text-4xl font-semibold tabular-nums sm:text-5xl">00</div>
          <p class="mt-2 text-xs uppercase tracking-widest text-sky-100/70">Hours</p>
        </div>
        <div class="rounded-2xl border border-white/15 bg-white/10 py-5 backdrop-blur">
          <div id="minutes" class="text-4xl font-semibold tabular-nums sm:text-5xl">00</div>
          <p class="mt-2 text-xs uppercase tracking-widest text-sky-100/70">Minutes</p>
        </div>
        <div class="rounded-2xl border border-white/15 bg-white/10 py-5 backdrop-blur">
          <div id="seconds" class="text-4xl font-semibold tabular-nums sm:text-5xl">00</div>
          <p class="mt-2 text-xs uppercase tracking-widest text-sky-100/70">Seconds</p>
        </div>
      </div>

      <div class="mt-8 rounded-2xl border border-white/15 bg-white/10 p-5 text-left backdrop-blur">
        <label for="target" class="block text-sm font-medium text-sky-100/80">Target date and time</label>
        <input
          id="target"
          type="datetime-local"
          class="mt-2 w-full rounded-xl border border-white/15 bg-slate-900/70 px-4 py-3 text-white outline-none focus:border-sky-300"
        />

        <div class="mt-4 flex flex-wrap gap-2">
          <button type="button" data-preset="1" class="rounded-full border border-white/15 px-4 py-2 text-sm hover:bg-white/10">+1 hour</button>
          <button type="button" data-preset="24" class="rounded-full border border-white/15 px-4 py-2 text-sm hover:bg-white/10">+1 day</button>
          <button type="button" data-preset="168" class="rounded-full border border-white/15 px-4 py-2 text-sm hover:bg-white/10">+7 days</button>
          <button type="button" data-preset="720" class="rounded-full border border-white/15 px-4 py-2 text-sm hover:bg-white/10">+30 days</button>
        </div>

        <p id="status" class="mt-4 min-h-5 text-sm text-sky-200/80" role="status" aria-live="polite">
          Set a target and press start.
        </p>

        <div class="mt-4 flex flex-col gap-3 sm:flex-row">
          <button id="start" type="button" class="flex-1 rounded-xl bg-white px-6 py-3 font-semibold text-sky-800 hover:bg-sky-50">
            Start countdown
          </button>
          <button id="reset" type="button" class="flex-1 rounded-xl border border-white/20 px-6 py-3 font-semibold hover:bg-white/10">
            Reset
          </button>
        </div>
      </div>
    </section>
  </main>

  <script src="index.js"></script>
</body>
</html>
