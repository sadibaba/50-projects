<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://images.unsplash.com" />
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen bg-neutral-950 text-white">
  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6">
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight">Image Gallery</h1>
        <p class="text-sm text-neutral-400 mt-1">Search the collection or use the arrows to browse.</p>
      </div>

      <div class="relative w-full sm:w-72">
        <label for="search" class="sr-only">Search images</label>
        <input
          id="search"
          type="search"
          placeholder="Search images"
          class="w-full rounded-full bg-neutral-900 border border-neutral-700 px-4 py-2 pr-10 text-sm placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-pink-400"
        />
        <svg class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-neutral-400" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z" stroke="currentColor" stroke-width="2" />
          <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </div>
    </header>

    <section class="relative rounded-2xl overflow-hidden border border-neutral-800 bg-neutral-900" aria-live="polite">
      <img
        id="mainImage"
        src="https://plus.unsplash.com/premium_photo-1661878091370-4ccb8763756a?q=80&w=1032&auto=format&fit=crop"
        alt="Mount Fuji panorama at sunrise"
        class="w-full h-[45vh] sm:h-[55vh] object-cover"
      />
      <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/80 to-transparent p-4 sm:p-6 flex items-end justify-between gap-4">
        <div>
          <p id="caption" class="text-lg sm:text-xl font-medium">Mount Fuji at sunrise</p>
          <p class="text-xs text-white/60 mt-1">Japan</p>
        </div>
        <div class="flex gap-2">
          <button id="prev" type="button" aria-label="Previous image" class="h-10 w-10 rounded-full bg-white/15 hover:bg-white/25 backdrop-blur text-xl">‹</button>
          <button id="next" type="button" aria-label="Next image" class="h-10 w-10 rounded-full bg-white/15 hover:bg-white/25 backdrop-blur text-xl">›</button>
        </div>
      </div>
    </section>

    <section>
      <div id="other" class="flex gap-3 sm:gap-4 overflow-x-auto no-scrollbar py-2">
        <button
          type="button"
          class="thumb group relative shrink-0 w-40 sm:w-48 h-24 sm:h-28 overflow-hidden rounded-xl border-2 border-pink-400"
          data-src="https://plus.unsplash.com/premium_photo-1661878091370-4ccb8763756a?q=80&w=1032&auto=format&fit=crop"
          data-title="Mount Fuji at sunrise"
          data-location="Japan"
          data-alt="Mount Fuji panorama at sunrise"
        >
          <img src="https://plus.unsplash.com/premium_photo-1661878091370-4ccb8763756a?q=80&w=1032&auto=format&fit=crop" alt="" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform" />
          <span class="sr-only">Mount Fuji at sunrise</span>
        </button>

        <button
          type="button"
          class="thumb group relative shrink-0 w-40 sm:w-48 h-24 sm:h-28 overflow-hidden rounded-xl border-2 border-transparent"
          data-src="https://images.unsplash.com/photo-1551685314-8167cf1cba72?q=80&w=870&auto=format&fit=crop"
          data-title="Traditional architecture"
          data-location="Kyoto"
          data-alt="Traditional Japanese architecture"
        >
          <img src="https://images.unsplash.com/photo-1551685314-8167cf1cba72?q=80&w=870&auto=format&fit=crop" alt="" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform" />
          <span class="sr-only">Traditional architecture</span>
        </button>

        <button
          type="button"
          class="thumb group relative shrink-0 w-40 sm:w-48 h-24 sm:h-28 overflow-hidden rounded-xl border-2 border-transparent"
          data-src="https://images.unsplash.com/photo-1526344966-89049886b28d?q=80&w=774&auto=format&fit=crop"
          data-title="Cherry blossoms"
          data-location="Tokyo"
          data-alt="Cherry blossoms in spring"
        >
          <img src="https://images.unsplash.com/photo-1526344966-89049886b28d?q=80&w=774&auto=format&fit=crop" alt="" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform" />
          <span class="sr-only">Cherry blossoms</span>
        </button>

        <button
          type="button"
          class="thumb group relative shrink-0 w-40 sm:w-48 h-24 sm:h-28 overflow-hidden rounded-xl border-2 border-transparent"
          data-src="https://images.unsplash.com/photo-1553996530-a73ac9783179?q=80&w=936&auto=format&fit=crop"
          data-title="City at dusk"
          data-location="Hong Kong"
          data-alt="City lights at dusk"
        >
          <img src="https://images.unsplash.com/photo-1553996530-a73ac9783179?q=80&w=936&auto=format&fit=crop" alt="" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform" />
          <span class="sr-only">City at dusk</span>
        </button>

        <button
          type="button"
          class="thumb group relative shrink-0 w-40 sm:w-48 h-24 sm:h-28 overflow-hidden rounded-xl border-2 border-transparent"
          data-src="https://plus.unsplash.com/premium_photo-1671807185041-f87439dfd82d?q=80&w=870&auto=format&fit=crop"
          data-title="Lake reflections"
          data-location="Alberta"
          data-alt="Mountain lake reflections"
        >
          <img src="https://plus.unsplash.com/premium_photo-1671807185041-f87439dfd82d?q=80&w=870&auto=format&fit=crop" alt="" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform" />
          <span class="sr-only">Lake reflections</span>
        </button>

        <button
          type="button"
          class="thumb group relative shrink-0 w-40 sm:w-48 h-24 sm:h-28 overflow-hidden rounded-xl border-2 border-transparent"
          data-src="https://plus.unsplash.com/premium_photo-1677347335458-a9840a5c917c?q=80&w=899&auto=format&fit=crop"
          data-title="Mountain trail"
          data-location="Switzerland"
          data-alt="Hiking trail in the mountains"
        >
          <img src="https://plus.unsplash.com/premium_photo-1677347335458-a9840a5c917c?q=80&w=899&auto=format&fit=crop" alt="" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform" />
          <span class="sr-only">Mountain trail</span>
        </button>
      </div>
      <p id="empty" class="hidden text-sm text-neutral-400 mt-2">No images match your search.</p>
    </section>
  </main>

  <script src="index.js"></script>
</body>
</html>
